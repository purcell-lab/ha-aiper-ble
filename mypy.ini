# Strict typing is introduced module by module (Platinum strict-typing rule).
# Add a module to [tool] "files" once it passes; CI runs exactly this list.
[mypy]
python_version = 3.14
strict = True
# Home Assistant re-exports platform names from package __init__ modules.
implicit_reexport = True
ignore_missing_imports = True
follow_imports = silent
files =
    custom_components/aiper_ble/const.py,
    custom_components/aiper_ble/device.py,
    custom_components/aiper_ble/s1_states.py,
    custom_components/aiper_ble/datapoints.py,
    custom_components/aiper_ble/errors.py,
    custom_components/aiper_ble/entity.py,
    custom_components/aiper_ble/repairs.py,
    custom_components/aiper_ble/protocol.py,
    custom_components/aiper_ble/transport_diagnostics.py,
    custom_components/aiper_ble/diagnostics.py,
    custom_components/aiper_ble/coordinator.py,
    custom_components/aiper_ble/controls.py,
    custom_components/aiper_ble/vacuum.py,
    custom_components/aiper_ble/sensor.py,
    custom_components/aiper_ble/config_flow.py,
    custom_components/aiper_ble/__init__.py,
    custom_components/aiper_ble/bluetooth_transport.py,
    custom_components/aiper_ble/local_transport.py,
    custom_components/aiper_ble/local_bleak.py
