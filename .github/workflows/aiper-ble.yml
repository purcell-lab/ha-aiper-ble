name: Aiper BLE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-aiper-ble-test.txt
      - run: pip install -r requirements-aiper-ble-test.txt
      - run: ruff check --config ruff-aiper.toml custom_components/aiper_ble tests/aiper_ble
      - run: ruff format --config ruff-aiper.toml --check custom_components/aiper_ble tests/aiper_ble
      - run: python -m pytest -q tests/aiper_ble --disable-socket --allow-unix-socket --asyncio-mode=auto
