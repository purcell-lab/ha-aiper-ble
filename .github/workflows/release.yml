name: Release

# Publish a GitHub release for the manifest version whenever main changes it.
# HACS reads the integration's domain and install path from the latest
# release, so releases must follow the manifest rather than manual tagging.
on:
  push:
    branches: [main]
    paths:
      - custom_components/aiper_ble/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read manifest version
        id: manifest
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/aiper_ble/manifest.json'))['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
